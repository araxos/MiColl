<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1125" width="2000" height="1125">
  <title>MiColl wallpaper — Petal wind</title>
  <!--
    Petal wind (sakura theme): hanafubuki, a gust carrying petals and a few whole
    blossoms from the top right corner down to the left. Soft bands of light show
    the wind. The petals thin out toward the left so the cards stay calm there.
  -->
