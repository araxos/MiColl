<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1125" width="2000" height="1125">
  <!--
    Circuit trace: a circuit board from above (cyberpunk theme). Traces come from the
    right and bottom, three of them glow. The left half is only dots so the page
    content stays readable. Generated from a seed.
  -->
  <defs>
    <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="1500" cy="700" r="1300">
      <stop offset="0%" stop-color="#0c1620"/>
      <stop offset="60%" stop-color="#070b11"/>
      <stop offset="100%" stop-color="#040508"/>
    </radialGradient>
    <radialGradient id="core" gradientUnits="userSpaceOnUse" cx="1560" cy="700" r="330">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="12.5" cy="12.5" r="1" fill="#7fb8cc" opacity="0.13"/>
    </pattern>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" opacity="0.5"/>
    </pattern>
    <radialGradient id="vig" gradientUnits="userSpaceOnUse" cx="1000" cy="520" r="1250">
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="dither" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="2000" height="1125" fill="url(#bg)"/>
  <rect width="2000" height="1125" fill="url(#dots)"/>
  <rect width="2000" height="1125" fill="url(#core)"/>
