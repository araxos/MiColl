<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1125" width="2000" height="1125">
  <title>MiColl wallpaper — Torii mist</title>
  <!--
    Torii mist (sakura theme): a large vermilion torii right of the middle, a pale
    sun framed by its posts, mist over the hills where the posts fade out, a branch
    in bloom from the top right corner and a few drifting petals. The left stays
    dark and calm for the cards.
  -->
