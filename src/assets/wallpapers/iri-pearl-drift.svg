<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="Pearl drift">
  <title>MiColl wallpaper — Pearl drift</title>
  <!--
    Pearl drift: a still version of the iridescent shader (IridescentFx).
    The shader is pale pearl (0.91, 0.91, 0.94) with pastel tints at 47%,
    so this is a light background with the theme's four pastels and soft shine.
  -->
  <defs>
    <linearGradient id="pearl" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#f2f0f7"/>
      <stop offset="0.45" stop-color="#e9e9f3"/>
      <stop offset="1" stop-color="#eceaf2"/>
    </linearGradient>

    <filter id="wide" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="165"/>
    </filter>
    <filter id="band" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>

    <!-- the theme's four colors: lavender, pink, mint, sky -->
    <linearGradient id="specular" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- soft shading so it looks curved, not flat -->
    <radialGradient id="curve" cx="0.42" cy="0.36" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#8f8aa6" stop-opacity="0.28"/>
    </radialGradient>

    <!-- light noise against color banding -->
    <filter id="dither" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2"
                    stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0" result="g"/>
      <feComponentTransfer in="g">
        <feFuncA type="linear" slope="0.045" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#pearl)"/>

  <!-- the tints, big and overlapping so the color flows. multiply so they don't
       turn white -->
  <g filter="url(#wide)" style="mix-blend-mode:multiply">
    <ellipse cx="230" cy="120" rx="700" ry="420" fill="#c4b5fd" opacity="0.55"/>
    <ellipse cx="1420" cy="60"  rx="640" ry="380" fill="#f5c2ff" opacity="0.52"/>
    <ellipse cx="1500" cy="820" rx="700" ry="430" fill="#a7f3d0" opacity="0.50"/>
    <ellipse cx="180"  cy="800" rx="660" ry="400" fill="#bae6fd" opacity="0.55"/>
    <ellipse cx="820"  cy="480" rx="520" ry="300" fill="#fef3c7" opacity="0.30"/>
  </g>

  <!-- two shine bands -->
  <g filter="url(#band)">
    <rect x="-300" y="230" width="2200" height="120" fill="url(#specular)"
          transform="rotate(-11 800 450)" opacity="0.55"/>
    <rect x="-300" y="600" width="2200" height="70" fill="url(#specular)"
          transform="rotate(-7 800 450)" opacity="0.4"/>
  </g>

  <rect width="1600" height="900" fill="url(#curve)"/>
  <rect width="1600" height="900" filter="url(#dither)" opacity="0.6"/>
</svg>
