<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9d8bf7"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9d8bf7"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <!-- a reward you have -->
    <g id="own">
      <rect width="76" height="40" rx="9" fill="url(#chip)" opacity="0.9"/>
      <rect x="8" y="8" width="24" height="24" rx="5" fill="#15121c" opacity="0.35"/>
      <rect x="38" y="13" width="30" height="5" rx="2.5" fill="#15121c" opacity="0.35"/>
      <rect x="38" y="23" width="20" height="5" rx="2.5" fill="#15121c" opacity="0.25"/>
    </g>
    <!-- a reward the template knows about but you don't have yet -->
    <g id="miss">
      <rect x="1" y="1" width="74" height="38" rx="9" fill="none" stroke="#5c5670" stroke-width="2" stroke-dasharray="5 4"/>
      <text x="38" y="25" fill="#8b85a0" font-size="11" text-anchor="middle">missing</text>
    </g>
  </defs>
  <rect width="800" height="300" rx="18" fill="#15121c"/>

  <!-- the template file -->
  <rect x="50" y="66" width="130" height="164" rx="12" fill="#211d2b" stroke="#9d8bf7" stroke-width="2"/>
  <path d="M150,66 L180,96" stroke="#9d8bf7" stroke-width="2"/>
  <path d="M150,66 L150,96 L180,96" fill="#2a2440" stroke="#9d8bf7" stroke-width="2" stroke-linejoin="round"/>
  <text x="66" y="92" fill="#e9e6f2" font-size="14" font-weight="700">Template</text>
  <text x="66" y="110" fill="#8b85a0" font-size="11">Bonnie</text>
  <rect x="66" y="126" width="98" height="6" rx="3" fill="#35304a"/>
  <rect x="66" y="140" width="80" height="6" rx="3" fill="#35304a"/>
  <rect x="66" y="154" width="92" height="6" rx="3" fill="#35304a"/>
  <rect x="66" y="168" width="70" height="6" rx="3" fill="#35304a"/>
  <rect x="66" y="182" width="86" height="6" rx="3" fill="#35304a"/>
  <!-- verified mark -->
  <circle cx="166" cy="214" r="13" fill="#5eead4"/>
  <path d="M159,214 L164,219 L173,209" stroke="#15121c" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="115" y="256" fill="#8b85a0" font-size="12" text-anchor="middle">one file</text>

  <!-- arrow -->
  <path d="M200,148 L244,148" stroke="#e9e6f2" stroke-width="3"/>
  <path d="M236,138 L248,148 L236,158" stroke="#e9e6f2" stroke-width="3" fill="none"/>

  <!-- the creator's release history -->
  <text x="270" y="52" fill="#e9e6f2" font-size="16" font-weight="700">Bonnie · Patreon · 2026</text>
  <text x="756" y="52" fill="#8b85a0" font-size="13" text-anchor="end">8 of 12 · 67%</text>
  <rect x="270" y="64" width="486" height="6" rx="3" fill="#2a2440"/>
  <rect x="270" y="64" width="326" height="6" rx="3" fill="url(#bar)"/>

  <g fill="#8b85a0" font-size="12" text-anchor="middle">
    <text x="308" y="98">Jan</text>
    <text x="390" y="98">Feb</text>
    <text x="472" y="98">Mar</text>
    <text x="554" y="98">Apr</text>
    <text x="636" y="98">May</text>
    <text x="718" y="98">Jun</text>
  </g>

  <!-- Jan -->
  <use href="#own" x="270" y="110"/>
  <use href="#own" x="270" y="158"/>
  <!-- Feb -->
  <use href="#own" x="352" y="110"/>
  <use href="#miss" x="352" y="158"/>
  <!-- Mar -->
  <use href="#own" x="434" y="110"/>
  <use href="#own" x="434" y="158"/>
  <use href="#own" x="434" y="206"/>
  <!-- Apr -->
  <use href="#miss" x="516" y="110"/>
  <use href="#own" x="516" y="158"/>
  <!-- May -->
  <use href="#own" x="598" y="110"/>
  <!-- Jun -->
  <use href="#miss" x="680" y="110"/>
  <use href="#miss" x="680" y="158"/>

  <text x="400" y="282" fill="#8b85a0" font-size="13" text-anchor="middle">Every release, month by month: what you have, and what's still missing.</text>
</svg>
