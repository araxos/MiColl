<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4e7e"/>
      <stop offset="1" stop-color="#ff9f45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="300" rx="18" fill="#15121c"/>

  <!-- left: the explorer way -->
  <text x="30" y="42" fill="#8b85a0" font-size="13" letter-spacing="2">FILE EXPLORER</text>
  <g font-size="14" fill="#d9d4e6">
    <rect x="30" y="64" width="150" height="34" rx="6" fill="#211d2b" stroke="#35304a"/>
    <path d="M44,77 h6 l2,2 h8 v10 h-16 z" fill="#ff9f45" opacity="0.85"/><text x="68" y="86">Bonnie</text>
    <rect x="60" y="112" width="150" height="34" rx="6" fill="#211d2b" stroke="#35304a"/>
    <path d="M74,125 h6 l2,2 h8 v10 h-16 z" fill="#ff9f45" opacity="0.85"/><text x="98" y="134">Patreon</text>
    <rect x="90" y="160" width="150" height="34" rx="6" fill="#211d2b" stroke="#35304a"/>
    <path d="M104,173 h6 l2,2 h8 v10 h-16 z" fill="#ff9f45" opacity="0.85"/><text x="128" y="182">2026</text>
    <rect x="120" y="208" width="150" height="34" rx="6" fill="#211d2b" stroke="#35304a"/>
    <path d="M134,221 h6 l2,2 h8 v10 h-16 z" fill="#ff9f45" opacity="0.85"/><text x="158" y="230">03</text>
  </g>
  <g fill="#ff4e7e" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="195" cy="81" r="10"/><text x="195" y="85" fill="#fff">1</text>
    <circle cx="225" cy="129" r="10"/><text x="225" y="133" fill="#fff">2</text>
    <circle cx="255" cy="177" r="10"/><text x="255" y="181" fill="#fff">3</text>
    <circle cx="285" cy="225" r="10"/><text x="285" y="229" fill="#fff">4</text>
  </g>
  <text x="30" y="272" fill="#8b85a0" font-size="13">Other platform? Back up, click down again.</text>

  <line x1="400" y1="36" x2="400" y2="264" stroke="#2c2738" stroke-width="2"/>

  <!-- right: micoll, one view -->
  <text x="430" y="42" fill="#8b85a0" font-size="13" letter-spacing="2">MICOLL</text>
  <g font-size="13" text-anchor="middle">
    <rect x="430" y="60" width="92" height="28" rx="14" fill="url(#brand)"/>
    <text x="476" y="79" fill="#fff" font-weight="600">Patreon</text>
    <rect x="530" y="60" width="78" height="28" rx="14" fill="#211d2b" stroke="#35304a"/>
    <text x="569" y="79" fill="#d9d4e6">Ko-fi</text>
    <rect x="616" y="60" width="84" height="28" rx="14" fill="#211d2b" stroke="#35304a"/>
    <text x="658" y="79" fill="#d9d4e6">Fansly</text>
  </g>
  <g font-size="13" fill="#8b85a0">
    <text x="430" y="118">2024</text><text x="482" y="118">2025</text>
    <text x="534" y="118" fill="#ff9f45" font-weight="700">2026</text>
  </g>
  <!-- month grid: filled = owned, outlined = missing -->
  <g>
    <rect x="430" y="132" width="52" height="52" rx="8" fill="url(#brand)" opacity="0.9"/>
    <rect x="490" y="132" width="52" height="52" rx="8" fill="url(#brand)" opacity="0.9"/>
    <rect x="550" y="132" width="52" height="52" rx="8" fill="url(#brand)" opacity="0.9"/>
    <rect x="610" y="132" width="52" height="52" rx="8" fill="none" stroke="#ff4e7e" stroke-dasharray="5 4" stroke-width="2"/>
    <rect x="670" y="132" width="52" height="52" rx="8" fill="url(#brand)" opacity="0.9"/>
    <rect x="730" y="132" width="52" height="52" rx="8" fill="#211d2b" stroke="#35304a"/>
    <rect x="430" y="192" width="52" height="52" rx="8" fill="#211d2b" stroke="#35304a"/>
    <rect x="490" y="192" width="52" height="52" rx="8" fill="#211d2b" stroke="#35304a"/>
    <rect x="550" y="192" width="52" height="52" rx="8" fill="#211d2b" stroke="#35304a"/>
    <rect x="610" y="192" width="52" height="52" rx="8" fill="#211d2b" stroke="#35304a"/>
    <rect x="670" y="192" width="52" height="52" rx="8" fill="#211d2b" stroke="#35304a"/>
    <rect x="730" y="192" width="52" height="52" rx="8" fill="#211d2b" stroke="#35304a"/>
  </g>
  <g font-size="11" fill="#fff" text-anchor="middle" font-weight="600">
    <text x="456" y="162">01</text><text x="516" y="162">02</text><text x="576" y="162">03</text>
    <text x="636" y="162" fill="#ff4e7e">04</text><text x="696" y="162">05</text>
  </g>
  <text x="430" y="272" fill="#8b85a0" font-size="13">Platforms, years and months in one view.</text>
</svg>
