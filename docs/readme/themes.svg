<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="orig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4e7e"/><stop offset="1" stop-color="#ff9f45"/>
    </linearGradient>
    <linearGradient id="sak" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f472b6"/><stop offset="1" stop-color="#ffe1ee"/>
    </linearGradient>
    <linearGradient id="iri" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="0.35" stop-color="#f5c2ff"/>
      <stop offset="0.7" stop-color="#a7f3d0"/><stop offset="1" stop-color="#bae6fd"/>
    </linearGradient>
  </defs>
  <rect width="800" height="230" rx="18" fill="#15121c"/>

  <!-- original -->
  <rect x="40" y="36" width="150" height="130" rx="16" fill="#1e1a26" stroke="url(#orig)" stroke-width="3"/>
  <rect x="56" y="52" width="118" height="70" rx="10" fill="url(#orig)" opacity="0.85"/>
  <rect x="56" y="134" width="80" height="10" rx="5" fill="#e9e6f2" opacity="0.8"/>
  <text x="115" y="198" fill="#e9e6f2" font-size="14" text-anchor="middle">Original</text>

  <!-- sakura -->
  <rect x="230" y="36" width="150" height="130" rx="22" fill="#241620" stroke="url(#sak)" stroke-width="3"/>
  <rect x="246" y="52" width="118" height="70" rx="16" fill="url(#sak)" opacity="0.85"/>
  <circle cx="352" cy="140" r="8" fill="#f472b6"/>
  <rect x="246" y="134" width="80" height="10" rx="5" fill="#ffe1ee" opacity="0.85"/>
  <text x="305" y="198" fill="#e9e6f2" font-size="14" text-anchor="middle">Sakura</text>

  <!-- cyberpunk: cut corners -->
  <path d="M420,52 L436,36 L570,36 L570,150 L554,166 L420,166 Z" fill="#0b0b0f" stroke="#fcee0a" stroke-width="3"/>
  <path d="M436,58 L446,52 L554,52 L554,122 L436,122 Z" fill="#fcee0a" opacity="0.9"/>
  <rect x="436" y="134" width="80" height="10" fill="#00f0ff"/>
  <rect x="524" y="134" width="14" height="10" fill="#ff003c"/>
  <text x="495" y="198" fill="#e9e6f2" font-size="14" text-anchor="middle">Cyberpunk</text>

  <!-- iridescent -->
  <rect x="610" y="36" width="150" height="130" rx="4" fill="#1b1d2a" stroke="url(#iri)" stroke-width="3"/>
  <rect x="626" y="52" width="118" height="70" rx="3" fill="url(#iri)" opacity="0.9"/>
  <rect x="626" y="134" width="80" height="10" rx="5" fill="url(#iri)"/>
  <text x="685" y="198" fill="#e9e6f2" font-size="14" text-anchor="middle">Iridescent</text>
</svg>
