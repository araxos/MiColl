<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9d8bf7"/>
      <stop offset="1" stop-color="#ff9f45"/>
    </linearGradient>
    <g id="scene">
      <rect width="170" height="100" fill="url(#sky)"/>
      <circle cx="124" cy="34" r="15" fill="#ffe1ee" opacity="0.9"/>
      <path d="M0,78 L40,52 L74,72 L114,44 L170,74 L170,100 L0,100 Z" fill="#2a2440"/>
      <path d="M0,90 L50,72 L96,88 L148,68 L170,78 L170,100 L0,100 Z" fill="#15121c"/>
    </g>
    <clipPath id="v1"><rect x="80" y="126" width="170" height="100" rx="10"/></clipPath>
    <clipPath id="v2"><rect x="315" y="126" width="170" height="100" rx="10"/></clipPath>
    <clipPath id="v3"><rect x="550" y="126" width="170" height="100" rx="10"/></clipPath>
  </defs>
  <rect width="800" height="300" rx="18" fill="#15121c"/>

  <!-- the tools -->
  <g font-size="13" fill="#e9e6f2">
    <rect x="46" y="28" width="108" height="44" rx="12" fill="#211d2b" stroke="#35304a" stroke-width="1.5"/>
    <path d="M62,58 C66,46 74,56 78,46 C80,42 84,44 84,48" stroke="#ff4e7e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="94" y="55">Erase</text>

    <rect x="166" y="28" width="108" height="44" rx="12" fill="#211d2b" stroke="#35304a" stroke-width="1.5"/>
    <circle cx="190" cy="50" r="10" fill="none" stroke="#9d8bf7" stroke-width="2" stroke-dasharray="3 3"/>
    <circle cx="190" cy="50" r="4" fill="#9d8bf7"/>
    <text x="210" y="55">Cutout</text>

    <rect x="286" y="28" width="108" height="44" rx="12" fill="#211d2b" stroke="#35304a" stroke-width="1.5"/>
    <path d="M304,40 L304,60 L324,60 M300,44 L320,44 L320,64" stroke="#9d8bf7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <text x="334" y="55">Crop</text>

    <rect x="406" y="28" width="108" height="44" rx="12" fill="#211d2b" stroke="#35304a" stroke-width="1.5"/>
    <path d="M438,50 A10,10 0 1 1 434,42" stroke="#9d8bf7" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <path d="M430,37 L435,42 L429,45" stroke="#9d8bf7" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="452" y="55">Rotate</text>

    <rect x="526" y="28" width="108" height="44" rx="12" fill="#211d2b" stroke="#35304a" stroke-width="1.5"/>
    <rect x="542" y="46" width="12" height="12" rx="2" fill="none" stroke="#9d8bf7" stroke-width="2"/>
    <path d="M552,48 L562,38 M556,38 L562,38 L562,44" stroke="#5eead4" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="572" y="55">Resize</text>

    <rect x="646" y="28" width="108" height="44" rx="12" fill="#211d2b" stroke="#35304a" stroke-width="1.5"/>
    <path d="M662,42 L684,42 M662,50 L684,50 M662,58 L684,58" stroke="#35304a" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="668" cy="42" r="3.4" fill="#9d8bf7"/>
    <circle cx="678" cy="50" r="3.4" fill="#5eead4"/>
    <circle cx="672" cy="58" r="3.4" fill="#ff9f45"/>
    <text x="694" y="55">Adjust</text>
  </g>

  <!-- versions: the original stays, every edit is a new one -->
  <g clip-path="url(#v1)">
    <use href="#scene" x="80" y="126"/>
    <text x="165" y="186" fill="#ffffff" opacity="0.55" font-size="15" font-weight="700" text-anchor="middle" transform="rotate(-12 165 180)">© WATERMARK</text>
  </g>
  <rect x="80" y="126" width="170" height="100" rx="10" fill="none" stroke="#35304a" stroke-width="2"/>

  <g clip-path="url(#v2)">
    <use href="#scene" x="315" y="126"/>
  </g>
  <rect x="315" y="126" width="170" height="100" rx="10" fill="none" stroke="#35304a" stroke-width="2"/>

  <g clip-path="url(#v3)">
    <!-- cropped: the same picture, closer -->
    <use href="#scene" transform="translate(530 112) scale(1.3)"/>
    <rect x="550" y="126" width="170" height="100" fill="#ffffff" opacity="0.06"/>
  </g>
  <rect x="550" y="126" width="170" height="100" rx="10" fill="none" stroke="#5eead4" stroke-width="3"/>
  <rect x="664" y="134" width="48" height="20" rx="10" fill="#5eead4"/>
  <text x="688" y="148" fill="#15121c" font-size="11" font-weight="700" text-anchor="middle">shown</text>

  <!-- arrows between versions -->
  <path d="M258,176 L304,176" stroke="#8b85a0" stroke-width="2.5"/>
  <path d="M297,169 L306,176 L297,183" stroke="#8b85a0" stroke-width="2.5" fill="none"/>
  <path d="M493,176 L539,176" stroke="#8b85a0" stroke-width="2.5"/>
  <path d="M532,169 L541,176 L532,183" stroke="#8b85a0" stroke-width="2.5" fill="none"/>

  <g font-size="13" text-anchor="middle">
    <text x="165" y="248" fill="#e9e6f2" font-weight="600">Original</text>
    <text x="165" y="264" fill="#8b85a0" font-size="11">kept as it is</text>
    <text x="400" y="248" fill="#e9e6f2" font-weight="600">Version 1</text>
    <text x="400" y="264" fill="#8b85a0" font-size="11">watermark erased</text>
    <text x="635" y="248" fill="#e9e6f2" font-weight="600">Version 2</text>
    <text x="635" y="264" fill="#8b85a0" font-size="11">cropped and brightened</text>
  </g>

  <text x="400" y="290" fill="#8b85a0" font-size="12" text-anchor="middle">Switch between them any time, or go back to the original.</text>
</svg>
